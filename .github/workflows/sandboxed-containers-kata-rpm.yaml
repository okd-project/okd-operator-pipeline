# Builds the Kata Containers RPM in Fedora COPR for the sandboxed-containers operator.
#
# Requires a repository secret named COPR_API_TOKEN containing the full contents of a
# COPR API config (from https://copr.fedorainfracloud.org/api/), i.e.:
#
#   [copr-cli]
#   login = <login>
#   username = <username>
#   token = <token>
#   copr_url = https://copr.fedorainfracloud.org
#
# See sandboxed-containers/copr/README.md for details (chroot selection, node-side repo).

on:
  push:
    branches:
      - "main"
    paths:
      - 'sandboxed-containers/copr/**'
  workflow_dispatch:
    inputs:
      copr_owner:
        description: "COPR owner (username or @group; default: owenh)"
        type: string
        required: false
      copr_project:
        description: "COPR project name (default: sandboxed-containers-<MAJOR>.<MINOR>, the operator version from sandboxed-containers/build.sh)"
        type: string
        required: false
      chroots:
        description: "Space-separated COPR chroots (must match the SCOS base OS)"
        type: string
        required: false
        default: "centos-stream-10-x86_64 centos-stream-10-aarch64"

name: Build Sandboxed-Containers Kata RPM (COPR)

jobs:
  copr-build:
    name: COPR build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install copr-cli
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install copr-cli

      - name: Configure COPR credentials
        run: |
          mkdir -p ~/.config
          printf '%s\n' "${{ secrets.COPR_API_TOKEN }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      # Empty inputs fall through to the script's own defaults (owner: owenh,
      # project: sandboxed-containers-<MAJOR>.<MINOR> from the operator version
      # exported in sandboxed-containers/build.sh). The script also writes the
      # step summary.
      - name: Build Kata RPM in COPR
        env:
          COPR_OWNER: ${{ inputs.copr_owner }}
          COPR_PROJECT: ${{ inputs.copr_project }}
          CHROOTS: ${{ inputs.chroots || 'centos-stream-10-x86_64 centos-stream-10-aarch64' }}
        run: |
          cd sandboxed-containers/copr
          ./copr-build.sh
