on:
  push:
    branches:
      - "release-4.22"
    paths:
      - 'gitops/**'
  workflow_dispatch: # Allow manual trigger

name: Deploy GitOps

jobs:
  deploy:
    name: Deploy GitOps
    uses: ./.github/workflows/operator-deploy.yaml
    with:
      operator: gitops
      catalog_branch: release-4.22
    secrets: inherit
