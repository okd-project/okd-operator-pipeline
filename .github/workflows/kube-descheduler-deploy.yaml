on:
  push:
    branches:
      - "release-4.22"
    paths:
      - 'kube-descheduler/**'
  workflow_dispatch: # Allow manual trigger

name: Deploy Kube-Descheduler

jobs:
  deploy:
    name: Deploy Kube-Descheduler
    uses: ./.github/workflows/operator-deploy.yaml
    with:
      operator: kube-descheduler
      catalog_branch: release-4.22
    secrets: inherit
