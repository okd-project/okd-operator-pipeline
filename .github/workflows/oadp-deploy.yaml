on:
  push:
    branches:
      - "release-4.22"
    paths:
      - 'oadp/**'
  workflow_dispatch: # Allow manual trigger

name: Deploy OADP

jobs:
  deploy:
    name: Deploy OADP
    uses: ./.github/workflows/operator-deploy.yaml
    with:
      operator: oadp
      catalog_branch: release-4.22
    secrets: inherit
